apiVersion: v1
kind: Namespace
metadata:
  name: ha-afu-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-afu-test
  namespace: ha-afu-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ha-afu-test
  template:
    metadata:
      labels:
        app: ha-afu-test
    spec:
      nodeSelector:
        kubernetes.io/hostname: alioth-4   # 有蓝牙适配器的节点
      # 内核的 AF_BLUETOOTH socket 只能在初始网络命名空间创建，HA 管理适配器
      # （mgmt socket）必须用宿主机网络，否则会降级运行。访问端口即 8123。
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        # 预置登录用户 test/test 并跳过 onboarding，免去首次引导
        - name: seed
          image: ghcr.dockerproxy.zltop.cn/home-assistant/home-assistant:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /config/.storage
              if [ ! -f /config/.storage/auth ]; then
                python -m homeassistant --script auth -c /config add test test
              fi
              if [ ! -f /config/.storage/onboarding ]; then
                echo '{"version":4,"minor_version":1,"key":"onboarding","data":{"done":["user","core_config","analytics","integration"]}}' > /config/.storage/onboarding
              fi
          volumeMounts:
            - {name: config, mountPath: /config}
      containers:
        - name: ha
          image: ghcr.dockerproxy.zltop.cn/home-assistant/home-assistant:latest
          env:
            - {name: TZ, value: Asia/Shanghai}
          # 官方文档（容器部署蓝牙）要求：HA 蓝牙栈需要管理适配器
          securityContext:
            capabilities:
              add: [NET_ADMIN, NET_RAW]
          ports:
            - containerPort: 8123
          volumeMounts:
            - {name: config, mountPath: /config}
            # 宿主机的 dbus（bluetoothd 在宿主机上，HA 的 bleak 经 dbus 访问）
            - {name: dbus, mountPath: /run/dbus, readOnly: true}
      volumes:
        - name: config
          hostPath: {path: /home/tony/ha-afu-test/config, type: DirectoryOrCreate}
        - name: dbus
          hostPath: {path: /run/dbus, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: ha-afu-test
  namespace: ha-afu-test
spec:
  type: NodePort
  selector:
    app: ha-afu-test
  ports:
    - {port: 8123, targetPort: 8123, nodePort: 30123}
