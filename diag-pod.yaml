# 一次性诊断 Pod：用 bleak 经宿主机 BlueZ 连接秤，逐步打印耗时和错误。
# 用法：kubectl apply -f diag-pod.yaml；kubectl -n ha-afu-test logs -f diag-ble；用完 kubectl delete -f diag-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: diag-ble
  namespace: ha-afu-test
spec:
  restartPolicy: Never
  hostNetwork: true
  nodeSelector:
    kubernetes.io/hostname: alioth-4
  containers:
    - name: diag
      image: ghcr.dockerproxy.zltop.cn/home-assistant/home-assistant:latest
      securityContext:
        capabilities:
          add: [NET_ADMIN, NET_RAW]
      volumeMounts:
        - {name: dbus, mountPath: /run/dbus, readOnly: true}
      command: ["python", "-u", "-c"]
      args:
        - |
          import asyncio, time
          from bleak import BleakScanner, BleakClient
          MAC = "B0:82:AB:10:89:6E"
          NOTIFY = "0000ffb2-0000-1000-8000-00805f9b34fb"
          WRITE = "0000ffb1-0000-1000-8000-00805f9b34fb"
          HS = bytes.fromhex("fd370000000000000037")
          ts = lambda: time.strftime("%T")
          async def main():
              for n in range(1, 25):
                  print(f"[{ts()}] #{n} 扫描 {MAC}（最多 20 秒）", flush=True)
                  t0 = time.time()
                  dev = await BleakScanner.find_device_by_address(MAC, timeout=20)
                  if not dev:
                      print("   没有看到广播（秤没醒？）", flush=True); continue
                  print(f"   {time.time()-t0:.1f}s 后看到广播，开始连接", flush=True)
                  c = BleakClient(dev, timeout=30, disconnected_callback=lambda _c: print(f"   [{ts()}] 断开回调触发", flush=True))
                  try:
                      t1 = time.time(); await c.connect()
                      print(f"   连接+服务发现完成，用时 {time.time()-t1:.1f}s", flush=True)
                      for s in c.services:
                          print("   服务", s.uuid, [(ch.uuid[4:8], list(ch.properties)) for ch in s.characteristics], flush=True)
                      await c.start_notify(NOTIFY, lambda _c, d: print(f"   [{ts()}] 通知 {bytes(d).hex()}", flush=True))
                      print("   已订阅 FFB2，发送握手", flush=True)
                      await c.write_gatt_char(WRITE, HS, response=False)
                      await asyncio.sleep(25)
                  except Exception as e:
                      print(f"   错误 {type(e).__name__}: {e}  （连接阶段已用 {time.time()-t1:.1f}s）", flush=True)
                  finally:
                      try: await c.disconnect()
                      except Exception: pass
              print("DIAG-DONE", flush=True)
          asyncio.run(main())
  volumes:
    - name: dbus
      hostPath: {path: /run/dbus, type: Directory}
